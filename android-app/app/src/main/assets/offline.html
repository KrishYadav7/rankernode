<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; }
  .card { max-width: 340px; }
  .icon { width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 20px; display: flex; align-items: center; justify-content: center;
          background: linear-gradient(135deg, #4f46e5, #06b6d4); color: #fff; font-size: 34px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 22px; color: #475569; }
  a.btn { display: inline-block; padding: 13px 28px; border-radius: 999px; background: #4f46e5; color: #fff; font-weight: 700; text-decoration: none; }
  small { display: block; margin-top: 16px; color: #94a3b8; }
  @media (prefers-color-scheme: dark) { body { background: #0b1226; color: #e2e8f0; } p { color: #94a3b8; } }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">&#x2708;</div>
    <h1>You're offline</h1>
    <p>RankerNode couldn't reach the internet. Check your Wi-Fi or mobile data and try again.</p>
    <a class="btn" href="altitude://retry">Try again</a>
    <small>We'll reconnect automatically when you're back online.</small>
  </div>
  <script>
    window.addEventListener('online', function () { location.href = 'altitude://retry'; });
  </script>
</body>
</html>
