<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' file: data:">
<title>RankerNode — offline</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0b1226; color: #e6ebf7;
    font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box;
  }
  .card { max-width: 420px; text-align: center; }
  img { width: 92px; height: 92px; border-radius: 22%; display: block; margin: 0 auto; }
  h1 { font-size: 22px; margin: 18px 0 6px; font-weight: 650; }
  p { margin: 0 0 22px; color: #aab4cc; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #4f5bd5; border: 0; border-radius: 10px;
    padding: 11px 26px; cursor: pointer;
  }
  button:hover { background: #5d69e6; }
  button:focus-visible { outline: 3px solid #a5b4fc; outline-offset: 2px; }
  small { display: block; margin-top: 18px; color: #6f7a96; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <img src="icon.png" alt="">
    <h1 id="t">You're offline</h1>
    <p id="d">RankerNode needs the internet. It will reconnect by itself as soon as you're back online.</p>
    <button id="retry" type="button">Try again</button>
    <small id="c"></small>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var u = q.get('u') || '';
    if (!/^https:\/\/([a-z0-9-]+\.)*rankernode\.tech(\/|$)/i.test(u)) u = 'https://rankernode.example/app';
    var code = Number(q.get('c') || 0);
    if (navigator.onLine && code !== -106) {
      document.getElementById('t').textContent = "Can't reach RankerNode";
      document.getElementById('d').textContent = 'Your internet looks connected, but the RankerNode server did not answer. Please try again in a moment.';
    }
    if (code) document.getElementById('c').textContent = 'Error ' + code;
    var going = false;
    function go() { if (going) return; going = true; location.replace(u); }
    document.getElementById('retry').addEventListener('click', go);
    window.addEventListener('online', function () { setTimeout(go, 800); });
    setInterval(function () { if (navigator.onLine && document.visibilityState === 'visible') go(); }, 20000);
  })();
</script>
</body>
</html>
