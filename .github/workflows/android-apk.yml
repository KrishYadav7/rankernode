# ============================================================
#  Build the RankerNode Android app (signed APK) in the cloud.
#  Runs when android-app/ changes on main, or by hand:
#  GitHub → Actions → "Android app (APK)" → Run workflow.
#  The finished RankerNode-<version>.apk (website) and
#  RankerNode-<version>-play.aab (Google Play) appear under the run's
#  "Artifacts" (and as a GitHub Release). Upload it in
#  Admin → Mobile App on the website.
#
#  One-time setup — repository Settings → Secrets and variables
#  → Actions → New repository secret:
#     ANDROID_KEYSTORE_BASE64   (contents of release-keystore.base64.txt)
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
# ============================================================
name: Android app (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KSP" ] || [ -z "$KA" ] || [ -z "$KP" ]; then
            echo "::error::Signing secrets are missing. Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD (see android-app/README.md)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore the signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android-app
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDirectRelease bundlePlayRelease --no-daemon --stacktrace

      - name: Name the APK
        id: apk
        run: |
          OUT="RankerNode-1.0.${{ github.run_number }}.apk"
          AAB="RankerNode-1.0.${{ github.run_number }}-play.aab"
          cp android-app/app/build/outputs/apk/direct/release/app-direct-release.apk "$OUT"
          cp android-app/app/build/outputs/bundle/playRelease/app-play-release.aab "$AAB"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT" "$AAB"
          sha256sum "$OUT" "$AAB"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: RankerNode-1.0.${{ github.run_number }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.aab }}
          retention-days: 90

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: RankerNode Android 1.0.${{ github.run_number }}
          body: |
            Signed Android app.
            • RankerNode-1.0.${{ github.run_number }}.apk — upload in the website's Admin → Apps tab
              so students get it from the "Get App" button.
            • RankerNode-1.0.${{ github.run_number }}-play.aab — upload in Google Play Console
              (Testing / Production → Create release).
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.aab }}
